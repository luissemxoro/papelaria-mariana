<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Papelaria Mariana - Pagamento</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .pagamento-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .cliente {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .cliente h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        .cliente p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }

        .resumo-valor {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
        }

        .resumo-valor h3 {
            margin: 0;
            color: #333;
        }

        .resumo-valor p {
            font-size: 28px;
            color: #28a745;
            font-weight: bold;
            margin: 10px 0 0;
        }

        .lista-resumo {
            margin-bottom: 20px;
        }

        .item-resumo {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .opcao-pagamento {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .opcao-pagamento:hover {
            background-color: #f8f9fa;
        }

        .opcao-pagamento input {
            margin-right: 10px;
            transform: scale(1.3);
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        button:hover {
            background-color: #218838;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0056b3;
            text-decoration: none;
        }

    </style>

</head>

<body>

<h1>Finalizar Pedido</h1>

<div class="pagamento-box">

    <div class="cliente">

        <h3>
            Dados do Cliente
        </h3>

        <p>
            <strong>Nome:</strong>
            <span id="cliente-nome"></span>
        </p>

        <p>
            <strong>E-mail:</strong>
            <span id="cliente-email"></span>
        </p>

        <p>
            <strong>Endereço:</strong>
            <span id="cliente-endereco"></span>
        </p>

    </div>

    <div class="lista-resumo"
         id="lista-resumo">
    </div>

    <div class="resumo-valor">

        <h3>
            Total a Pagar:
        </h3>

        <p id="valor-final">
            R$ 0,00
        </p>

    </div>

    <h3>
        Escolha a forma de pagamento:
    </h3>

    <label class="opcao-pagamento">

        <input
            type="radio"
            name="forma_pagamento"
            value="pix"
            checked
        >

        <strong>
            PIX
        </strong>

        <span style="margin-left:5px;">
            (Aprovação imediata)
        </span>

    </label>

    <label class="opcao-pagamento">

        <input
            type="radio"
            name="forma_pagamento"
            value="cartao"
        >

        <strong>
            Cartão de Crédito
        </strong>

        <span style="margin-left:5px;">
            (Até 3x sem juros)
        </span>

    </label>

    <button onclick="concluirCompra()">

        Confirmar Pedido

    </button>

    <a
        href="carrinho.html"
        class="voltar">

        ← Voltar para o carrinho

    </a>

</div>

<script>

function formatarMoeda(valor) {

    return new Intl.NumberFormat(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    ).format(valor);

}

function obterCarrinho() {

    return JSON.parse(
        localStorage.getItem("carrinho")
    ) || [];

}

function obterCliente() {

    return JSON.parse(
        localStorage.getItem("cliente")
    ) || null;

}

function calcularTotal(carrinho) {

    return carrinho.reduce(
        (total, item) =>
            total +
            (item.preco * item.quantidade),
        0
    );

}

function carregarPagina() {

    const carrinho =
        obterCarrinho();

    const cliente =
        obterCliente();

    if (carrinho.length === 0) {

        alert(
            "Seu carrinho está vazio."
        );

        window.location.href =
            "index.html";

        return;
    }

    if (!cliente) {

        alert(
            "Precisamos dos seus dados para continuar."
        );

        window.location.href =
            "cadastro.html";

        return;
    }

    document.getElementById(
        "cliente-nome"
    ).innerText = cliente.nome;

    document.getElementById(
        "cliente-email"
    ).innerText = cliente.email;

    document.getElementById(
        "cliente-endereco"
    ).innerText = cliente.endereco;

    const lista =
        document.getElementById(
            "lista-resumo"
        );

    lista.innerHTML = "";

    carrinho.forEach(item => {

        const subtotal =
            item.preco *
            item.quantidade;

        const div =
            document.createElement("div");

        div.className =
            "item-resumo";

        div.innerHTML = `
            <span>
                ${item.nome}
                <br>
                Tamanho: ${item.tamanho}
                <br>
                Quantidade: ${item.quantidade}
            </span>

            <strong>
                ${formatarMoeda(subtotal)}
            </strong>
        `;

        lista.appendChild(div);

    });

    const total =
        calcularTotal(carrinho);

    document.getElementById(
        "valor-final"
    ).innerText =
        formatarMoeda(total);
}

function gerarNumeroPedido() {

    const agora =
        new Date();

    const numero =
        agora.getTime()
        .toString()
        .slice(-8);

    return "PM-" + numero;

}

function concluirCompra() {

    const carrinho =
        obterCarrinho();

    const cliente =
        obterCliente();

    if (carrinho.length === 0) {

        alert(
            "Seu carrinho está vazio."
        );

        return;
    }

    if (!cliente) {

        alert(
            "Dados do cliente não encontrados."
        );

        return;
    }

    const formaPagamento =
        document.querySelector(
            'input[name="forma_pagamento"]:checked'
        ).value;

    const total =
        calcularTotal(carrinho);

    const numeroPedido =
        gerarNumeroPedido();

    const pedido = {

        numero: numeroPedido,

        cliente: cliente,

        itens: carrinho,

        total: total,

        pagamento: formaPagamento,

        data: new Date().toISOString(),

        status: "Aguardando pagamento"

    };

    localStorage.setItem(
        "ultimoPedido",
        JSON.stringify(pedido)
    );

    /*
        IMPORTANTE:

        Neste momento o pagamento é apenas
        uma simulação.

        Posteriormente vamos substituir
        esta parte por Mercado Pago,
        Stripe, PagSeguro ou outro gateway.
    */

    if (formaPagamento === "pix") {

        alert(
            "Pedido " +
            numeroPedido +
            " criado!\n\n" +
            "Pagamento selecionado: PIX\n\n" +
            "Nesta versão de teste, o PIX ainda não é gerado automaticamente."
        );

    } else {

        alert(
            "Pedido " +
            numeroPedido +
            " criado!\n\n" +
            "Pagamento selecionado: Cartão.\n\n" +
            "A integração com o gateway de pagamento será adicionada posteriormente."
        );

    }

    /*
        Limpa somente o carrinho.

        Os dados do cliente e o último pedido
        permanecem salvos.
    */

    localStorage.removeItem(
        "carrinho"
    );

    window.location.href =
        "index.html";

}

carregarPagina();

</script>

</body>
</html>
