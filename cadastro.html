<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Papelaria Mariana - Cadastro</title>
</head>

<body class="pagina-formulario">

    <main class="formulario-container">

        <h1>Crie sua conta</h1>

        <p class="subtitulo">
            Preencha seus dados para continuar sua compra.
        </p>

        <form id="formCadastro" class="formulario" novalidate>

            <h2>Dados pessoais</h2>

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >
                <small class="erro" id="erroNome"></small>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
                <small class="erro" id="erroEmail"></small>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    autocomplete="tel"
                    maxlength="15"
                    required
                >
                <small class="erro" id="erroTelefone"></small>
            </div>

            <h2>Endereço</h2>

            <div class="campo">
                <label for="cep">CEP</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    autocomplete="postal-code"
                    maxlength="9"
                    required
                >
                <small class="erro" id="erroCep"></small>
            </div>

            <div class="campo">
                <label for="logradouro">Endereço</label>
                <input
                    type="text"
                    id="logradouro"
                    name="logradouro"
                    placeholder="Rua, Avenida..."
                    autocomplete="street-address"
                    required
                >
                <small class="erro" id="erroLogradouro"></small>
            </div>

            <div class="linha-campos">

                <div class="campo">
                    <label for="numero">Número</label>
                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Número"
                        required
                    >
                    <small class="erro" id="erroNumero"></small>
                </div>

                <div class="campo">
                    <label for="complemento">Complemento</label>
                    <input
                        type="text"
                        id="complemento"
                        name="complemento"
                        placeholder="Apto, bloco..."
                    >
                </div>

            </div>

            <div class="linha-campos">

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Bairro"
                        autocomplete="address-level3"
                        required
                    >
                    <small class="erro" id="erroBairro"></small>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Cidade"
                        autocomplete="address-level2"
                        required
                    >
                    <small class="erro" id="erroCidade"></small>
                </div>

            </div>

            <div class="campo">
                <label for="estado">Estado</label>

                <select
                    id="estado"
                    name="estado"
                    autocomplete="address-level1"
                    required
                >
                    <option value="">Selecione o estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <small class="erro" id="erroEstado"></small>
            </div>

            <div id="mensagemCadastro" class="mensagem"></div>

            <button type="submit" class="btn-continuar">
                Continuar para pagamento
            </button>

        </form>

        <button type="button" id="btnVoltar" class="btn-voltar">
            Voltar para o carrinho
        </button>

    </main>

    <script src="js/cadastro.js"></script>

</body>

</html>
