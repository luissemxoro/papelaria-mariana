<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Papelaria Mariana - Carrinho</title>
</head>
<body class="pagina-carrinho">

<div class="container">
    <h1>Seu Carrinho de Compras</h1>

    <div class="carrinho">
        <div id="lista-carrinho"></div>

        <div class="total">
            <span>Total a Pagar:</span>
            <span id="preco-total">R$ 0,00</span>
        </div>

        <div class="botoes">
            <button class="botao-principal" onclick="irParaCadastro()">
                Finalizar Compra
            </button>

            <a href="index.html" class="botao-secundario">
                Continuar Comprando
            </a>
        </div>
    </div>
</div>

<script src="js/carrinho.js"></script>
</body>
</html>
